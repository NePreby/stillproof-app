name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Test
        run: npx jest --ci
      - name: Expo doctor
        run: npx expo-doctor

  # Builds a debug APK on Linux (Windows hits MAX_PATH in the native build)
  # and attaches it to the run, so the app can be installed and tried.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build debug APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: stillproof-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
