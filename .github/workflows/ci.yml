name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Test
        run: npx jest --ci
      - name: Expo doctor
        run: npx expo-doctor

  # Builds a debug APK on Linux (Windows hits MAX_PATH in the native build)
  # and attaches it to the run, so the app can be installed and tried.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Check the keys module is autolinked
        run: npx expo-modules-autolinking resolve --platform android | grep -q stillproof-keys
      - name: Unit-test the keys module (JVM)
        working-directory: android
        run: ./gradlew :stillproof-keys:testDebugUnitTest -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Build debug APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: stillproof-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Builds for the iOS simulator without signing, which proves the Swift compiles.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Check the App Attest entitlement
        run: grep -q appattest-environment ios/Stillproof/Stillproof.entitlements
      - name: Install pods
        working-directory: ios
        run: pod install
      - name: Build for the simulator
        working-directory: ios
        run: >-
          xcodebuild build
          -workspace Stillproof.xcworkspace
          -scheme Stillproof
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
