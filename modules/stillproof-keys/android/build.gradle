plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.stillprooflabs'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "io.github.stillprooflabs.keys"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
